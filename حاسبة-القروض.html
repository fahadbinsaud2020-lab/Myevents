<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة القروض</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0d3b2e 0%, #1a5c47 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fdfaf3;
    border-radius: 18px;
    padding: 30px 26px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    border: 2px solid #c9a24b;
    position: relative;
  }
  h1 {
    text-align: center;
    color: #0d3b2e;
    font-size: 24px;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #9c7b2e;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
    background: #f2ead6;
    padding: 5px;
    border-radius: 12px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: bold;
    color: #6b5a2e;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .tab.active {
    background: #0d3b2e;
    color: #f2d98a;
  }

  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    font-weight: bold;
  }
  .hint {
    font-size: 11.5px;
    color: #9c7b2e;
    margin-top: 4px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d8c99a;
    border-radius: 10px;
    font-size: 15px;
    background: #fff;
    color: #0d3b2e;
    text-align: center;
  }
  input:focus {
    outline: none;
    border-color: #c9a24b;
    box-shadow: 0 0 0 3px rgba(201,162,75,0.2);
  }
  button.calc-btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(135deg, #c9a24b, #a97f2f);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s;
  }
  button.calc-btn:hover { transform: translateY(-2px); }

  .results {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 2px dashed #c9a24b;
    display: none;
  }
  .results.show { display: block; }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    font-size: 14.5px;
    color: #333;
    border-bottom: 1px solid #eee2c2;
  }
  .result-row .value {
    font-weight: bold;
    color: #0d3b2e;
    font-size: 16px;
  }
  .result-row.main {
    background: #0d3b2e;
    color: #fff;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 6px;
    border-bottom: none;
  }
  .result-row.main .value { color: #f2d98a; font-size: 20px; }

  .frame-corner {
    position: absolute;
    width: 24px; height: 24px;
    border: 3px solid #c9a24b;
  }
  .frame-corner.tl { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0;}
  .frame-corner.br { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 12px;}

  .mode-panel { display: none; }
  .mode-panel.active { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="frame-corner tl"></div>
  <div class="frame-corner br"></div>
  <h1>حاسبة القروض</h1>
  <div class="subtitle">حسب نظام الربح الثابت (كما هو معتمد في ملفك)</div>

  <div class="tabs">
    <div class="tab active" data-mode="1">المبلغ الافتراضي</div>
    <div class="tab" data-mode="2">مبلغ التمويل المطلوب</div>
    <div class="tab" data-mode="3">الحد المتاح</div>
  </div>

  <!-- Common fields -->
  <div class="field">
    <label>إجمالي الراتب الشهري (ريال)</label>
    <input type="number" id="salary" placeholder="مثال: 24742">
  </div>
  <div class="field">
    <label>عدد السنوات</label>
    <input type="number" id="years" placeholder="مثال: 4">
  </div>
  <div class="field">
    <label>النسبة السنوية (%)</label>
    <input type="number" id="rate" step="0.01" placeholder="مثال: 1">
    <div class="hint">نسبة ربح ثابتة سنويًا (غير مركّبة) تُضرب في عدد السنوات</div>
  </div>

  <!-- Mode 1: default max amount based on debt burden ratio -->
  <div class="mode-panel active" id="panel1">
    <div class="field">
      <label>الحد الأقصى لنسبة القسط من الراتب (%)</label>
      <input type="number" id="ratioCap" step="0.01" value="33">
    </div>
  </div>

  <!-- Mode 2: required financing amount -->
  <div class="mode-panel" id="panel2">
    <div class="field">
      <label>مبلغ التمويل المطلوب (ريال)</label>
      <input type="number" id="principalInput" placeholder="مثال: 350000">
    </div>
  </div>

  <!-- Mode 3: available limit from desired monthly installment -->
  <div class="mode-panel" id="panel3">
    <div class="field">
      <label>القسط الشهري المطلوب (ريال)</label>
      <input type="number" id="installmentInput" placeholder="مثال: 6185">
    </div>
  </div>

  <button class="calc-btn" onclick="calculate()">احسب</button>

  <div class="results" id="results">
    <div class="result-row main">
      <span id="mainLabel">مبلغ التمويل (Applied Amount)</span>
      <span class="value" id="mainValue">0</span>
    </div>
    <div class="result-row">
      <span>القسط الشهري</span>
      <span class="value" id="monthly">0</span>
    </div>
    <div class="result-row">
      <span>أرباح البنك</span>
      <span class="value" id="profit">0</span>
    </div>
    <div class="result-row">
      <span>المبلغ الشامل (إجمالي السداد)</span>
      <span class="value" id="totalRepay">0</span>
    </div>
    <div class="result-row">
      <span>نسبة القسط من الراتب</span>
      <span class="value" id="ratioOut">0</span>
    </div>
  </div>
</div>

<script>
let currentMode = 1;

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    currentMode = parseInt(tab.dataset.mode);
    document.getElementById('panel' + currentMode).classList.add('active');
    document.getElementById('results').classList.remove('show');
  });
});

function fmt(n) {
  return new Intl.NumberFormat('ar-SA', {maximumFractionDigits: 2}).format(n);
}

function roundDownToHundred(n) {
  return Math.floor(n / 100) * 100;
}

function calculate() {
  const salary = parseFloat(document.getElementById('salary').value);
  const years = parseFloat(document.getElementById('years').value);
  const rate = parseFloat(document.getElementById('rate').value);

  if (!salary || salary <= 0 || !years || years <= 0 || isNaN(rate) || rate < 0) {
    alert('يرجى إدخال قيم صحيحة في الحقول المشتركة (الراتب، السنوات، النسبة)');
    return;
  }

  const months = years * 12;
  const rateFactor = (rate * years) / ((rate * years) + 100); // نسبة الربح من إجمالي المبلغ الشامل

  let principal, monthly, profit, totalRepay, ratioOut;

  if (currentMode === 1) {
    const ratioCap = parseFloat(document.getElementById('ratioCap').value);
    if (!ratioCap || ratioCap <= 0) { alert('يرجى إدخال نسبة القسط القصوى'); return; }
    const totalRepayCap = salary * (ratioCap / 100) * months;
    const principalRaw = totalRepayCap * (1 - rateFactor);
    principal = roundDownToHundred(principalRaw);
    profit = principal * (rate * years) / 100;
    totalRepay = principal + profit;
    monthly = totalRepay / months;
    ratioOut = monthly / salary;

  } else if (currentMode === 2) {
    principal = parseFloat(document.getElementById('principalInput').value);
    if (!principal || principal <= 0) { alert('يرجى إدخال مبلغ التمويل المطلوب'); return; }
    profit = principal * (rate * years) / 100;
    totalRepay = principal + profit;
    monthly = totalRepay / months;
    ratioOut = monthly / salary;

  } else {
    monthly = parseFloat(document.getElementById('installmentInput').value);
    if (!monthly || monthly <= 0) { alert('يرجى إدخال القسط الشهري المطلوب'); return; }
    totalRepay = monthly * months;
    profit = rateFactor * totalRepay;
    principal = totalRepay - profit;
    ratioOut = monthly / salary;
  }

  const labels = {
    1: 'المبلغ الافتراضي (Applied Amount)',
    2: 'مبلغ التمويل المطلوب (Applied Amount)',
    3: 'الحد المتاح (Applied Amount)'
  };

  document.getElementById('mainLabel').textContent = labels[currentMode];
  document.getElementById('mainValue').textContent = fmt(principal) + ' ريال';
  document.getElementById('monthly').textContent = fmt(monthly) + ' ريال';
  document.getElementById('profit').textContent = fmt(profit) + ' ريال';
  document.getElementById('totalRepay').textContent = fmt(totalRepay) + ' ريال';
  document.getElementById('ratioOut').textContent = (ratioOut * 100).toFixed(2) + '%';
  document.getElementById('results').classList.add('show');
}
</script>
</body>
</html>
