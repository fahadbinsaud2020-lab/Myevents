<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زَمكان — حاسبة العمر بالتقويمين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d1128;
    --bg-mid:#141a3a;
    --card:#1a2148;
    --card-edge:rgba(255,255,255,.06);
    --gold:#e7b24a;
    --gold-soft:#f6d98a;
    --teal:#28b8a3;
    --teal-soft:#7de3d3;
    --text:#f4efe2;
    --muted:#93a0c9;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(231,178,74,.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(40,184,163,.12), transparent 45%),
      var(--bg-deep);
    background-attachment:fixed;
    font-family:'Tajawal', sans-serif;
    color:var(--text);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
  }

  /* faint star / geometric texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.35;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.4) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.35) 0, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.4) 0, transparent 100%),
      radial-gradient(1px 1px at 55% 85%, rgba(255,255,255,.3) 0, transparent 100%);
  }

  .page{
    width:100%;
    max-width:440px;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }

  header .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.5px;
    margin-bottom:6px;
  }

  h1{
    font-family:'Aref Ruqaa', serif;
    font-size:34px;
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--gold-soft), var(--teal-soft));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }

  .card{
    background:linear-gradient(180deg, var(--card), var(--bg-mid));
    border:1px solid var(--card-edge);
    border-radius:22px;
    padding:22px;
    box-shadow:var(--shadow);
  }

  .mode-switch{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,.04);
    padding:5px;
    border-radius:14px;
    margin-bottom:18px;
  }

  .mode-switch button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:10px 6px;
    border-radius:10px;
    cursor:pointer;
    transition:.25s;
  }

  .mode-switch button.active{
    background:linear-gradient(135deg, var(--gold), var(--teal));
    color:#0d1128;
    box-shadow:0 6px 16px rgba(231,178,74,.25);
  }

  .mode-panel{display:none;}
  .mode-panel.active{display:block; animation:fadeIn .3s ease;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  label{
    display:block;
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:8px;
    font-weight:500;
  }

  input[type="date"], input[type="number"], select{
    width:100%;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:12px;
    outline:none;
    transition:.2s;
  }

  input:focus, select:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(40,184,163,.18);
  }

  .hijri-row{
    display:grid;
    grid-template-columns:1fr 1.4fr 1fr;
    gap:8px;
  }

  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    opacity:.8;
  }

  .calc-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:14px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    font-weight:900;
    color:#0d1128;
    background:linear-gradient(90deg, var(--gold), var(--teal));
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .calc-btn:active{ transform:scale(.98); }
  .calc-btn:hover{ box-shadow:0 10px 24px rgba(40,184,163,.28); }

  .error-msg{
    color:#ff9d9d;
    font-size:13px;
    margin-top:10px;
    display:none;
  }

  /* ===== Medallion result card ===== */
  .medallion-wrap{
    margin-top:20px;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity .5s ease, max-height .6s ease;
  }
  .medallion-wrap.show{
    opacity:1;
    max-height:400px;
  }

  .weekday-label{
    text-align:center;
    font-family:'Aref Ruqaa', serif;
    font-size:20px;
    color:var(--gold-soft);
    margin-bottom:10px;
    letter-spacing:.5px;
  }

  .medallion{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    display:flex;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.08);
  }

  .half{
    flex:1;
    padding:22px 14px;
    text-align:center;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .half.sun{
    background:linear-gradient(160deg, #1c5f57, #0f3d38);
  }
  .half.moon{
    background:linear-gradient(200deg, #6b4a17, #40300f);
  }

  .seam{
    width:2px;
    background:linear-gradient(180deg, transparent, rgba(255,255,255,.35), transparent);
    position:relative;
  }
  .seam::before{
    content:"✦";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:14px;
    color:var(--gold-soft);
    background:var(--card);
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  .half .icon{ font-size:26px; line-height:1; }
  .half .cal-label{
    font-size:11.5px;
    letter-spacing:1px;
    color:rgba(255,255,255,.6);
    text-transform:uppercase;
  }
  .half .date-val{
    font-family:'Aref Ruqaa', serif;
    font-size:19px;
    font-weight:700;
    color:#fff;
    margin-top:2px;
  }
  .half .age-val{
    font-size:13px;
    color:rgba(255,255,255,.85);
    margin-top:4px;
  }
  .half .age-val b{
    font-size:20px;
    display:block;
    font-family:'Tajawal',sans-serif;
    font-weight:900;
    color:var(--gold-soft);
  }
  .half.sun .age-val b{ color:var(--teal-soft); }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    margin-top:22px;
    opacity:.7;
  }

  footer .privacy-note{
    color:var(--teal-soft);
    font-weight:700;
    opacity:1;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow">🌙 ✦ ☀️</div>
    <h1>زَمكان</h1>
    <p>حاسبة العمر بالتقويمين — أدخل التاريخ أو العمر، وشوف الهجري والميلادي جنبًا إلى جنب</p>
  </header>

  <div class="card">
    <div class="mode-switch" role="tablist">
      <button class="active" data-mode="gregorian">📅 ميلادي</button>
      <button data-mode="hijri">🌙 هجري</button>
      <button data-mode="age">🔢 العمر</button>
    </div>

    <div id="panel-gregorian" class="mode-panel active">
      <label for="greg-date">تاريخ الميلاد (ميلادي)</label>
      <input type="date" id="greg-date">
    </div>

    <div id="panel-hijri" class="mode-panel">
      <label>تاريخ الميلاد (هجري)</label>
      <div class="hijri-row">
        <select id="hijri-day"></select>
        <select id="hijri-month"></select>
        <input type="number" id="hijri-year" placeholder="السنة (مثال: 1417)" min="1200" max="1500">
      </div>
      <p class="hint">التقويم الهجري المستخدم: أم القرى</p>
    </div>

    <div id="panel-age" class="mode-panel">
      <label for="age-input">العمر الحالي (بالسنوات الميلادية)</label>
      <input type="number" id="age-input" min="0" max="120" placeholder="مثال: 30">
    </div>

    <button class="calc-btn" id="calc-btn">احسب ✦</button>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <div class="medallion-wrap" id="result-wrap">
    <div class="weekday-label" id="res-weekday">—</div>
    <div class="medallion">
      <div class="half sun">
        <span class="icon">☀️</span>
        <span class="cal-label">الميلادي</span>
        <span class="date-val" id="res-greg-date">—</span>
        <span class="age-val">العمر<b id="res-greg-age">—</b></span>
      </div>
      <div class="seam"></div>
      <div class="half moon">
        <span class="icon">🌙</span>
        <span class="cal-label">الهجري</span>
        <span class="date-val" id="res-hijri-date">—</span>
        <span class="age-val">العمر<b id="res-hijri-age">—</b></span>
      </div>
    </div>
  </div>

  <footer><span class="privacy-note">لا يتم حفظ أي بيانات</span> — كل الحساب يتم داخل متصفحك فقط</footer>
</div>

<script>
(function(){
  var HIJRI_MONTHS = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
  var GREG_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var WEEKDAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

  // ---- populate hijri selects ----
  var dayEl = document.getElementById('hijri-day');
  var monthEl = document.getElementById('hijri-month');
  for(var d=1; d<=30; d++){
    var o = document.createElement('option');
    o.value = d; o.textContent = d;
    dayEl.appendChild(o);
  }
  HIJRI_MONTHS.forEach(function(name, idx){
    var o = document.createElement('option');
    o.value = idx+1; o.textContent = name;
    monthEl.appendChild(o);
  });

  // ---- mode switching ----
  var modeButtons = document.querySelectorAll('.mode-switch button');
  modeButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      modeButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.mode-panel').forEach(function(p){ p.classList.remove('active'); });
      document.getElementById('panel-' + btn.dataset.mode).classList.add('active');
      hideResult();
      hideError();
    });
  });

  function currentMode(){
    return document.querySelector('.mode-switch button.active').dataset.mode;
  }

  // ---- Hijri <-> Gregorian conversion using Umm al-Qura via Intl ----
  var hijriFormatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {year:'numeric', month:'numeric', day:'numeric'});

  function gregorianToHijri(date){
    var parts = hijriFormatter.formatToParts(date);
    var obj = {};
    parts.forEach(function(p){ if(p.type !== 'literal') obj[p.type] = parseInt(p.value, 10); });
    return {y: obj.year, m: obj.month, d: obj.day};
  }

  function hijriKey(h){ return h.y*10000 + h.m*100 + h.d; }

  function hijriToGregorian(hy, hm, hd){
    var target = hy*10000 + hm*100 + hd;
    var approxDays = (hy-1)*354.36667 + (hm-1)*29.5 + (hd-1);
    var epochMs = Date.UTC(622, 6, 19); // approx Islamic epoch
    var guess = new Date(epochMs + approxDays*86400000);

    var lo = new Date(guess.getTime() - 90*86400000);
    var hi = new Date(guess.getTime() + 90*86400000);

    var guardCount = 0;
    while(hijriKey(gregorianToHijri(lo)) > target && guardCount < 20){ lo = new Date(lo.getTime() - 90*86400000); guardCount++; }
    guardCount = 0;
    while(hijriKey(gregorianToHijri(hi)) < target && guardCount < 20){ hi = new Date(hi.getTime() + 90*86400000); guardCount++; }

    for(var i=0; i<60; i++){
      if(hi.getTime() - lo.getTime() <= 86400000) break;
      var mid = new Date((lo.getTime() + hi.getTime()) / 2);
      var key = hijriKey(gregorianToHijri(mid));
      if(key < target){ lo = mid; } else { hi = mid; }
    }

    var cursor = new Date(lo.getTime() - 5*86400000);
    for(var j=0; j<15; j++){
      if(hijriKey(gregorianToHijri(cursor)) === target){ return cursor; }
      cursor = new Date(cursor.getTime() + 86400000);
    }
    return lo; // fallback, extremely close
  }

  function gregorianAge(birth, today){
    var age = today.getFullYear() - birth.getFullYear();
    var m = today.getMonth() - birth.getMonth();
    if(m < 0 || (m === 0 && today.getDate() < birth.getDate())){ age--; }
    return age;
  }

  function hijriAge(birthH, todayH){
    var age = todayH.y - birthH.y;
    if(todayH.m < birthH.m || (todayH.m === birthH.m && todayH.d < birthH.d)){ age--; }
    return age;
  }

  function formatGregorian(date){
    return date.getDate() + ' ' + GREG_MONTHS[date.getMonth()] + ' ' + date.getFullYear() + 'م';
  }

  function formatHijri(h){
    return h.d + ' ' + HIJRI_MONTHS[h.m - 1] + ' ' + h.y + 'هـ';
  }

  function showError(msg){
    var el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError(){
    document.getElementById('error-msg').style.display = 'none';
  }
  function hideResult(){
    document.getElementById('result-wrap').classList.remove('show');
  }

  function renderResult(gregDate, hijriObj){
    var today = new Date();
    var todayHijri = gregorianToHijri(today);

    document.getElementById('res-greg-date').textContent = formatGregorian(gregDate);
    document.getElementById('res-hijri-date').textContent = formatHijri(hijriObj);
    document.getElementById('res-greg-age').textContent = gregorianAge(gregDate, today) + ' سنة';
    document.getElementById('res-hijri-age').textContent = hijriAge(hijriObj, todayHijri) + ' سنة';
    document.getElementById('res-weekday').textContent = WEEKDAYS[gregDate.getDay()];

    document.getElementById('result-wrap').classList.add('show');
  }

  document.getElementById('calc-btn').addEventListener('click', function(){
    hideError();
    var mode = currentMode();

    if(mode === 'gregorian'){
      var val = document.getElementById('greg-date').value;
      if(!val){ showError('اختر تاريخ الميلاد أولًا'); hideResult(); return; }
      var parts = val.split('-');
      var gdate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      if(gdate > new Date()){ showError('التاريخ لا يمكن أن يكون في المستقبل'); hideResult(); return; }
      var hijriObj = gregorianToHijri(gdate);
      renderResult(gdate, hijriObj);

    } else if(mode === 'hijri'){
      var hd = parseInt(dayEl.value);
      var hm = parseInt(monthEl.value);
      var hy = parseInt(document.getElementById('hijri-year').value);
      if(!hy || hy < 1200 || hy > 1500){ showError('أدخل سنة هجرية صحيحة (مثال: 1417)'); hideResult(); return; }
      var gDateFromHijri = hijriToGregorian(hy, hm, hd);
      if(gDateFromHijri > new Date()){ showError('التاريخ لا يمكن أن يكون في المستقبل'); hideResult(); return; }
      renderResult(gDateFromHijri, {y:hy, m:hm, d:hd});

    } else if(mode === 'age'){
      var age = parseInt(document.getElementById('age-input').value);
      if(isNaN(age) || age < 0 || age > 120){ showError('أدخل عمرًا صحيحًا بين 0 و120'); hideResult(); return; }
      var today2 = new Date();
      var birth = new Date(today2.getFullYear() - age, today2.getMonth(), today2.getDate());
      var hijriFromAge = gregorianToHijri(birth);
      renderResult(birth, hijriFromAge);
    }
  });

  // default hijri selects to a sensible mid value
  dayEl.value = 1;
  monthEl.value = 1;
})();
</script>
</body>
</html>
