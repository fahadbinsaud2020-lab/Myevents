<html lang="ar" dir="rtl">
<head>

<title>عانيات الزواج</title>

<style>
:root{
  color-scheme:light;
  --g1:#b6ecbf;--g2:#e7f9ea;--g3:#2f9e5f;
  --b1:#a5dbf4;--b2:#e4f5fd;--b3:#1b8cc4;
  --ink:#12353c;--mute:#4f7077;--bg:#f3fbf8;--card:#ffffff;--line:#cfe8e2;
  --shadow:0 6px 20px rgba(27,140,196,.12);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --g1:#1d5a3a;--g2:#173a2a;--g3:#6fdc9c;
  --b1:#1a5170;--b2:#142f40;--b3:#6cc8f2;
  --ink:#e5f5ef;--mute:#9bbdb8;--bg:#0d2227;--card:#14323a;--line:#255059;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(135deg,var(--g1),var(--b1));padding:26px 18px 56px;text-align:center;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:1.7rem;font-weight:800}
header p{margin:6px 0 0;color:var(--mute);font-size:.95rem}
.badge{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.55);font-size:.8rem;font-weight:700;color:var(--ink)}
@media (prefers-color-scheme:dark){.badge{background:rgba(0,0,0,.25)}}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:-30px 0 16px;padding:4px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:11px 18px;border-radius:16px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.tab[aria-selected=true]{background:linear-gradient(135deg,var(--g3),var(--b3));color:#fff;border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:18px;padding:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat:nth-child(odd){background:linear-gradient(160deg,var(--g2),var(--card))}
.stat:nth-child(even){background:linear-gradient(160deg,var(--b2),var(--card))}
.stat small{display:block;color:var(--mute);font-size:.8rem}
.stat b{font-size:1.35rem;font-weight:800}
.stat:nth-child(odd) b{color:var(--g3)}.stat:nth-child(even) b{color:var(--b3)}
.stat span{font-size:.75rem;color:var(--mute);font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-bottom:16px}
.tools{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media(min-width:700px){.tools{grid-template-columns:2fr 1fr 1fr}}
.tools input,.tools select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
.tools input:focus,.tools select:focus{border-color:var(--b3)}
.sum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.9rem;padding:9px 12px;border-radius:12px;background:linear-gradient(90deg,var(--g2),var(--b2));margin-bottom:10px}
.scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);max-height:68vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{position:sticky;top:0;background:linear-gradient(90deg,var(--g1),var(--b1));color:var(--ink);padding:11px 10px;text-align:right;cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
th .ar{opacity:.55;font-size:.8em;margin-inline-start:4px}
td{padding:9px 10px;border-top:1px solid var(--line)}
tbody tr:nth-child(odd){background:var(--g2)}tbody tr:nth-child(even){background:var(--b2)}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
td.idx{color:var(--mute);width:42px}
td.zero{color:var(--mute);font-weight:400}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--b1);color:var(--ink);white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute)}
h2{font-size:1.1rem;margin:0 0 10px}
.grp{margin-bottom:14px}.grp h3{margin:0 0 6px;font-size:.95rem;color:var(--b3)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px}
.row:nth-child(odd){background:var(--g2)}.row:nth-child(even){background:var(--b2)}
.row em{display:block;font-style:normal;font-size:.75rem;color:var(--mute)}
.row b{white-space:nowrap}
.row.tot{background:linear-gradient(90deg,var(--g1),var(--b1));font-weight:800}
.final .row{font-weight:700}
.final .row:last-child{background:linear-gradient(90deg,var(--g3),var(--b3));color:#fff}
.final .row:last-child em{color:#eaf7ff}
footer{text-align:center;color:var(--mute);font-size:.8rem;margin-top:8px}
</style>
</head>

  $('ledger').style.display=all?'none':'block';
  if(!all){
    const g=cur.ledger.map(g=>`<div class="grp"><h3>${esc(g.t)}</h3>${g.rows.map(r=>`<div class="row"><span>${esc(r[0])}${r[2]?`<em>${esc(r[2])}</em>`:''}</span><b>${fmt(r[1])}</b></div>`).join('')}<div class="row tot"><span>${esc(g.sum[0])}</span><b>${fmt(g.sum[1])}</b></div></div>`).join('');
    const f=`<div class="final">${cur.final.map(r=>`<div class="row"><span>${esc(r[0])}${r[2]?`<em>${esc(r[2])}</em>`:''}</span><b>${fmt(r[1])} ر.س</b></div>`).join('')}</div>`;
    $('ledger').innerHTML=`<h2>المصروفات والحساب — زواج ${esc(cur.name)}</h2>${g}${f}`;
  }
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){S.tab=b.dataset.id;render()}});
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('range').addEventListener('change',e=>{const [a,b]=e.target.value.split('-');S.min=+a||0;S.max=b?+b:Infinity;render()});
$('sort').addEventListener('change',e=>{const m=e.target.value.match(/^(\w)-(-?1)$/);S.key=m[1];S.dir=+m[2];render()});
$('thead').addEventListener('click',e=>{const t=e.target.closest('th[data-k]');if(!t)return;const k=t.dataset.k;
  if(S.key===k)S.dir=-S.dir;else{S.key=k;S.dir=k==='a'?-1:1}
  $('sort').value=[...$('sort').options].some(o=>o.value===k+'-'+S.dir)?k+'-'+S.dir:$('sort').value;render()});
render();
</script>
</body>
</html>
